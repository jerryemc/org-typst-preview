name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs-nox
      - name: Compile and test
        run: make check
