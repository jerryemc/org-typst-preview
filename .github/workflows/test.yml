name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5
      - uses: purcell/setup-emacs@v8.0
        with:
          version: 30.1
      - name: Compile and test
        run: make check
